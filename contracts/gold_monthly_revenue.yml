# ============================================================================
# DATA CONTRACT — Open Data Contract Standard (ODCS) v3.0.1
# ============================================================================
# Gold-layer table: gold_meta_monthly_revenue
#
# Source of truth: src/meta_driven_etl/config/gold_tables.yml
#   (table: monthly_revenue). Physical table produced as a Databricks
#   materialized view by src/meta_driven_etl/pipeline/gold_aggregation.py
# Keep in sync with gold_tables.yml; bump `version` on any schema change.
# ============================================================================

apiVersion: v3.0.1
kind: DataContract
id: gold-monthly-revenue
name: Monthly Revenue
version: 1.0.0
status: active
domain: finance
dataProduct: revenue-analytics
tenant: vdm_classic_aerfvt

description:
  purpose: >-
    Monthly revenue and order metrics. One row per (order_year, order_month)
    with gross/net revenue, order counts, shipping, and discounts.
  usage: >-
    Read-only analytical consumption for revenue dashboards and trend reports.
  limitations: >-
    Materialized view reflecting upstream silver state at last refresh.

servers:
  - server: prod
    type: databricks
    environment: production
    host: fe-vm-vdm-classic-aerfvt.cloud.databricks.com
    catalog: vdm_classic_aerfvt_catalog
    schema: gold
    format: delta
  - server: dev
    type: databricks
    environment: development
    host: fe-vm-vdm-classic-aerfvt.cloud.databricks.com
    catalog: vdm_classic_aerfvt_catalog
    schema: gold_dev
    format: delta

schema:
  - name: gold_meta_monthly_revenue
    physicalName: gold_meta_monthly_revenue
    physicalType: materialized_view
    logicalType: object
    description: Monthly revenue and order metrics.
    businessName: Monthly Revenue
    dataGranularityDescription: One row per (order_year, order_month).
    properties:

      - name: order_year
        businessName: Order Year
        logicalType: integer
        physicalType: INT
        description: Calendar year of the orders. Part of the grain.
        primaryKey: true
        required: true
        classification: internal

      - name: order_month
        businessName: Order Month
        logicalType: integer
        physicalType: INT
        description: Calendar month (1-12) of the orders. Part of the grain.
        primaryKey: true
        required: true
        classification: internal

      - name: total_revenue
        businessName: Total Revenue
        logicalType: number
        physicalType: DECIMAL(18,2)
        description: Total gross revenue for the month (SUM of total_amount).
        required: true
        quality:
          - rule: minValue
            mustBeGreaterThan: 0
            severity: warning
            description: Monthly revenue should be positive.

      - name: total_net_revenue
        businessName: Total Net Revenue
        logicalType: number
        physicalType: DECIMAL(18,2)
        description: Revenue after discounts (SUM of net_amount).
        required: true

      - name: total_orders
        businessName: Total Orders
        logicalType: integer
        physicalType: BIGINT
        description: Number of orders in the month.
        required: true

      - name: avg_order_value
        businessName: Average Order Value
        logicalType: number
        physicalType: DECIMAL(10,2)
        description: Average net order value, rounded to 2 decimals.
        required: true

      - name: total_shipping
        businessName: Total Shipping
        logicalType: number
        physicalType: DECIMAL(18,2)
        description: Total shipping charges for the month.
        required: true

      - name: total_discounts
        businessName: Total Discounts
        logicalType: number
        physicalType: DECIMAL(18,2)
        description: Total discounts given in the month.
        required: true

quality:
  - name: positive_revenue
    rule: sql
    query: total_revenue > 0
    severity: warning
    description: Monthly revenue should be positive.
  - name: unique_month_grain
    rule: uniqueness
    dimension: [order_year, order_month]
    severity: error
    description: (order_year, order_month) must be unique — it is the grain.

lineage:
  sources:
    - name: silver_meta_clean_orders
      catalog: vdm_classic_aerfvt_catalog
      schema: silver
      relationship: primary
      description: Order fact source; aggregated by year and month.
  transformation: >-
    GROUP BY order_year, order_month over silver_meta_clean_orders.

slaProperties:
  - property: refreshFrequency
    value: on-upstream-change
    description: Materialized view auto-refreshes on upstream change.
  - property: retention
    value: unlimited
    description: Delta-backed; retention governed by catalog defaults.

team:
  - role: owner
    description: Data Engineering — meta_driven_etl pipeline owner.
support:
  - channel: '#data-engineering'
    tool: slack
    scope: interactive

tags:
  - gold
  - finance
  - revenue
  - materialized-view
