name: Gold data contracts

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --dev
      - name: Validate contracts against config
        run: uv run validate-gold-contracts
      - name: Run unit tests
        run: uv run pytest
      # Live validation is intentionally excluded: PR CI has no workspace credentials.
